name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sentinel
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -c "import glob, subprocess, sys; subprocess.run([sys.executable, 'tests/installed_smoke.py', glob.glob('dist/*.whl')[0]], check=True)"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom@26
      - run: node --check sentinel/static/app.js
      - run: node --check sentinel/static/controls.js
      - run: node --check sentinel/static/i18n.js
      - run: node tests/ui-flow.cjs
